name: Driver app

on:
  pull_request:
    paths: ["driver/**", ".github/workflows/driver.yml"]
  push:
    branches: [main]
    paths: ["driver/**", ".github/workflows/driver.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: driver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: driver
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
