<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Votre candidature</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #333333; margin: 0; padding: 0; line-height: 1.6;">
<div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid #eeeeee; margin-bottom: 24px;">
        <span th:style="'font-size: 24px; font-weight: bold; color: ' + ${color}" th:text="${brand}">NDZELA</span>
    </div>
    <p>Bonjour <span th:text="${name}">Candidat</span>,</p>
    <th:block th:if="${accepted}">
        <p>Bonne nouvelle : votre candidature a été retenue. Nous vous recevons pour un entretien le :</p>
        <p style="font-size: 18px; font-weight: 600;" th:text="${when}">lundi 1 janvier 2026 à 10h00</p>
    </th:block>
    <th:block th:unless="${accepted}">
        <p>Après étude de votre dossier, nous ne pouvons pas donner suite à votre candidature pour le moment.</p>
    </th:block>
    <p th:if="${message != ''}" style="background: #f5f7fa; padding: 12px 16px; border-radius: 8px;" th:text="${message}">Message</p>
    <p style="color: #888888; font-size: 12px; margin-top: 32px;"><span th:text="${company}">NDZELA SARL</span> - Mobilité Électrique</p>
</div>
</body>
</html>
