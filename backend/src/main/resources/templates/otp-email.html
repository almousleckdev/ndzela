<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification du code OTP</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #333333; margin: 0; padding: 0; line-height: 1.6;">
<div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid #eeeeee; margin-bottom: 24px;">
        <span style="font-size: 24px; font-weight: bold;" th:style="'font-size: 24px; font-weight: bold; color: ' + ${color}" th:text="${brand}">NDZELA</span>
    </div>
    <div style="text-align: center;">
        <p style="font-size: 20px; font-weight: 600; margin: 0 0 16px;">Vérification du code OTP</p>
        <p>Voici le code à usage unique pour finaliser votre connexion en toute sécurité. Il est valable 3 minutes.</p>
        <p style="font-size: 36px; font-weight: 700; letter-spacing: 10px; margin: 28px 0;" th:style="'font-size: 36px; font-weight: 700; letter-spacing: 10px; margin: 28px 0; color: ' + ${color}" th:text="${otp}">000000</p>
        <p style="color: #64748b; font-size: 13px; margin-top: 24px;">Si vous n'avez pas demandé ce code, ignorez cet e-mail et assurez-vous que votre compte est sécurisé.</p>
    </div>
    <div style="text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #eeeeee;">
        <p style="color: #94a3b8; font-size: 12px; margin: 0 0 12px;">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> <span th:text="${company}">NDZela SARL</span>. Tous droits réservés.</p>
        <img th:if="${logo}" th:src="${logo}" alt="" style="height: 32px; width: auto;" />
    </div>
</div>
</body>
</html>
