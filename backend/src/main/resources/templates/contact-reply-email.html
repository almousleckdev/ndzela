<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réponse à votre message</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #333333; margin: 0; padding: 0; line-height: 1.6;">
<div style="max-width: 600px; margin: 0 auto; padding: 40px 20px;">
    <div style="text-align: center; padding-bottom: 24px; border-bottom: 1px solid #eeeeee; margin-bottom: 24px;">
        <span th:style="'font-size: 24px; font-weight: bold; color: ' + ${color}" th:text="${brand}">NDZELA</span>
    </div>
    <p>Bonjour <span th:text="${name}">Visiteur</span>,</p>
    <p>En réponse à votre message « <span th:text="${subject}">Sujet</span> » :</p>
    <p style="background: #f5f7fa; padding: 12px 16px; border-radius: 8px; white-space: pre-line;" th:text="${reply}">Réponse</p>
    <div style="text-align: center; margin-top: 32px; padding-top: 20px; border-top: 1px solid #eeeeee;">
        <p style="color: #94a3b8; font-size: 12px; margin: 0 0 12px;">&copy; <span th:text="${#dates.year(#dates.createNow())}"></span> <span th:text="${company}">NDZela SARL</span>. Tous droits réservés.</p>
        <img th:if="${logo}" th:src="${logo}" alt="" style="height: 32px; width: auto;" />
    </div>
</div>
</body>
</html>
