# Secrets have no defaults on purpose: the app refuses to start without them.
# Provide them as environment variables, or in backend/.env (git-ignored; see .env.example).
spring:
  application:
    name: ndzela-admin
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ndzela_admin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 20MB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  mail:
    provider: ${MAIL_PROVIDER:smtp} # smtp | resend (HTTPS API) | log (prints to console, local dev only)
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${MAIL_FROM:NDZela Admin <onboarding@resend.dev>}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}            # base64, >= 256 bits: openssl rand -base64 48
    issuer: ndzela-admin
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 24h
    challenge-ttl: 10m               # time allowed to finish password -> OTP -> MFA
    password-reset-ttl: 15m
    invitation-ttl: 48h
    refresh-cookie:
      name: ndzela_refresh
      secure: ${COOKIE_SECURE:false}  # set COOKIE_SECURE=true behind HTTPS (always in production)
      same-site: Strict
  otp:
    ttl: 3m
    max-attempts: 3
    resend-cooldown: 60s
  brute-force:
    max-failed-attempts: 5
    lock-duration: 30m
  mfa:
    issuer: NDZela Admin
    encryption-key: ${MFA_ENCRYPTION_KEY} # base64 of 32 bytes: openssl rand -base64 32
  storage:
    upload-dir: ${UPLOAD_DIR:./uploads}
  bootstrap:
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:superadmin@ndzela.com}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}

logging:
  level:
    com.ndzela.admin: INFO
    org.springframework.security: INFO
