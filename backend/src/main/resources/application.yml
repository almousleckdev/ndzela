# Secrets have no defaults on purpose: the app refuses to start without them.
# Provide them as environment variables, or in backend/.env (git-ignored; see .env.example).
server:
  port: ${PORT:8080}                    # Railway and similar hosts give the port to listen on
  # Behind a reverse proxy set FORWARD_HEADERS_STRATEGY=native so the rate limits and the audit trail see the visitor, not the proxy.
  # Leave it "none" when the app is reachable directly: the headers could then be forged.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
management:
  health:
    mail:
      enabled: false   # a mail outage must not mark the whole service DOWN and get it restarted
spring:
  application:
    name: ndzela-admin
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ndzela_admin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # the schema is owned by Flyway
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}               # only for MAIL_PROVIDER=smtp
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000
          auth: true
          starttls:
            enable: true

  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 20MB

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

app:
  environment: ${APP_ENVIRONMENT:}   # development | staging | production; unset: COOKIE_SECURE=true means production (strict startup checks)
  mail:
    provider: ${MAIL_PROVIDER:smtp} # smtp | resend (HTTPS API) | log (prints to console, local dev only)
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${MAIL_FROM:NDZela Admin <onboarding@resend.dev>}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}   # the web admin only: these may send the cookie
  jwt:
    secret: ${JWT_SECRET}            # base64, >= 256 bits: openssl rand -base64 48
    issuer: ndzela-admin
    access-token-ttl: 15m
  auth:
    refresh-token-ttl: 24h
    challenge-ttl: 10m               # time allowed to finish password -> OTP -> MFA
    password-reset-ttl: 15m
    invitation-ttl: 48h
    refresh-cookie:
      name: ndzela_refresh
      secure: ${COOKIE_SECURE:false}  # set COOKIE_SECURE=true behind HTTPS (always in production)
      same-site: Strict
  otp:
    ttl: 3m
    max-attempts: 3
    resend-cooldown: 60s
  brute-force:
    max-failed-attempts: 5
    lock-duration: 30m
  mfa:
    issuer: NDZela Admin
    encryption-key: ${MFA_ENCRYPTION_KEY} # base64 of 32 bytes: openssl rand -base64 32
  storage:                                  # Cloudinary: no defaults, the app refuses to start without them
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    root-folder: ${CLOUDINARY_ROOT_FOLDER}  # separates environments inside one account: ndzela-dev, ndzela-prod
    request-timeout: 15s
  pvit:
    base-url: ${PVIT_BASE_URL:https://api.mypvit.pro}
    airtel-operation-account-code: ${PVIT_AIRTEL_OPERATION_ACCOUNT_CODE:}
    moov-operation-account-code: ${PVIT_MOOV_OPERATION_ACCOUNT_CODE:}
    secret-password: ${PVIT_SECRET_PASSWORD:}
    code-url-secret: ${PVIT_CODE_URL_SECRET:}
    code-url-payment: ${PVIT_CODE_URL_PAYMENT:}
    code-url-status: ${PVIT_CODE_URL_STATUS:}
    code-url-fees: ${PVIT_CODE_URL_FEES:}
    code-url-kyc: ${PVIT_CODE_URL_KYC:}
    callback-url-code: ${PVIT_CALLBACK_URL_CODE:}
    agent: ${PVIT_AGENT:NDZELA}
    product: ${PVIT_PRODUCT:LOYER}
    owner-charge: ${PVIT_OWNER_CHARGE:CUSTOMER}   # CUSTOMER: the driver pays the fee on top | MERCHANT: NDZELA absorbs it
    sandbox-amount: ${PVIT_SANDBOX_AMOUNT:}        # sandbox only: PVit succeeds below 1000 XAF; leave empty in production
    request-timeout: 20s
    recheck-after: 3m                              # a payment with no callback after this is checked with PVit
    expire-after: 30m                              # a payment still pending after this is closed as expired
    reconcile-enabled: true
  driver-app:
    lock-after-unpaid-days: ${DRIVER_LOCK_AFTER_UNPAID_DAYS:3}   # from this many unpaid days a driver can only use the payment screen until all is paid
  ocpp:
    base-url: ${OCPP_BASE_URL:https://zella-ocpp.com}
    api-key: ${OCPP_FLEET_API_KEY:${OCPP_API_KEY:}}  # the Fleet API key (X-API-Key); never in a frontend or the app. Empty: no sync
    signing-secret: ${OCPP_SIGNING_SECRET:}          # the HMAC secret of our Fleet account (not the API key, not the webhook secret); empty: calls are sent unsigned
    webhook-secret: ${OCPP_WEBHOOK_SECRET:}         # the HMAC-SHA256 signing secret of their webhooks; empty: every webhook is refused
    webhook-header: ${OCPP_WEBHOOK_HEADER:X-Webhook-Signature}   # the header carrying the signature
    country-code: ${OCPP_COUNTRY:GA}                # the country the platform's stations and sessions belong to
    sync-enabled: ${OCPP_SYNC_ENABLED:false}        # off: the sessions come from the Zella app's feed; NDZela does not call the OCPP platform
    sync-interval: ${OCPP_SYNC_INTERVAL:PT10S}       # between two syncs when no webhook asked for one (6 of the 60 requests a minute)
    sync-page-size: 500                             # 1 to 1000
    request-timeout: 15s
  zella:
    base-url: ${ZELLA_BASE_URL:}                     # the Zella Charging app's partner API; empty: no lookup
    api-key: ${ZELLA_API_KEY:}                       # our key for it (X-Api-Key), bound to one country; never in a frontend or the app
    country-code: ${ZELLA_COUNTRY:GA}                # the country the key and its drivers belong to
    lookup-enabled: ${ZELLA_LOOKUP_ENABLED:true}
    lookup-interval: ${ZELLA_LOOKUP_INTERVAL:PT15M}  # between two lookups of the drivers not matched yet
    # app.zella.feed-interval (PT30S) and the two *-initial-delay settings can be overridden; tests push the schedules out so the jobs never run by themselves
    request-timeout: 10s
  rate-limit:
    password-reset-per-address: ${RATE_LIMIT_RESET_PER_ADDRESS:10}   # reset requests one address can send in an hour
    password-reset-per-account: ${RATE_LIMIT_RESET_PER_ACCOUNT:3}    # reset e-mails one account receives in an hour
    pvit-callback-per-minute: ${RATE_LIMIT_PVIT_CALLBACK:120}        # callbacks one address may send per minute (the recheck job settles any that are refused)
    login-attempts-per-ip-per-minute: ${RATE_LIMIT_LOGIN_PER_IP:20}  # staff or driver login attempts one address may send per minute, before account lookup
  public-site:
    country-code: ${PUBLIC_SITE_COUNTRY:GA}          # the country the website's applications and messages belong to
    max-submissions-per-hour: ${PUBLIC_SITE_MAX_PER_HOUR:5}
    allowed-origins: ${PUBLIC_SITE_ORIGINS:http://localhost:3001}   # the website: may only post to /api/v1/public, never with credentials
  bootstrap:
    initial-admin-email: ${INITIAL_ADMIN_EMAIL:superadmin@ndzela.com}
    initial-admin-password: ${INITIAL_ADMIN_PASSWORD:}

logging:
  level:
    com.ndzela.admin: INFO
    org.springframework.security: INFO
